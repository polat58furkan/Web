<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LéGéND — Sesli Sohbet</title>
  <!-- PeerJS SDK -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- FontAwesome İkonları -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151921;
      --accent-color: #00ff88;
      --accent-hover: #00cc6d;
      --danger-color: #ff4757;
      --text-color: #f1f2f6;
      --text-muted: #a4b0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: #0b0e14;
      border: 1px solid #2f3542;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #fff;
    }

    .btn-secondary {
      background-color: #2f3542;
      color: #fff;
    }

    .room-panel {
      display: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-color);
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: var(--accent-color);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-color);
      animation: pulse-animation 1.5s infinite;
    }

    @keyframes pulse-animation {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
    }

    .user-list {
      background: #0b0e14;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      text-align: left;
      max-height: 180px;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.9rem;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .error-msg {
      color: var(--danger-color);
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">LéGéND</div>
    <div class="subtitle">Güvenli P2P Sesli Sohbet Odası</div>

    <!-- GİRİŞ EKRANI -->
    <div id="login-panel">
      <div class="input-group">
        <label for="username">Kullanıcı Adın</label>
        <input type="text" id="username" placeholder="Örn: Kral" maxlength="15">
      </div>
      <div class="input-group">
        <label for="room-id">Oda Adı / Şifresi</label>
        <input type="text" id="room-id" placeholder="Örn: legend-ekip" value="legend-sohbet">
      </div>
      <button class="btn btn-primary" id="join-btn">
        <i class="fa-solid fa-headset"></i> Odaya Katıl
      </button>
      <div id="error-box" class="error-msg"></div>
    </div>

    <!-- ODA EKRANI -->
    <div id="room-panel" class="room-panel">
      <div class="status-badge">
        <div class="pulse"></div>
        <span id="room-display-name">Oda: legend-sohbet</span>
      </div>

      <div class="user-list">
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">ODADAKİ BAĞLANTILAR</div>
        <div id="users-container"></div>
      </div>

      <div class="controls">
        <button class="btn btn-secondary" id="mute-btn">
          <i class="fa-solid fa-microphone"></i> Sesi Kapat
        </button>
        <button class="btn btn-danger" id="leave-btn">
          <i class="fa-solid fa-phone-slash"></i> Ayrıl
        </button>
      </div>
      <button class="btn btn-secondary" id="test-audio-btn" style="margin-top: 10px; font-size: 0.85rem;">
        <i class="fa-solid fa-volume-high"></i> Kendi Sesini Test Et (Kapalı)
      </button>
    </div>
  </div>

  <div id="audio-container" style="display:none;"></div>

  <script>
    let localStream = null;
    let peer = null;
    let isMuted = false;
    let isTestLoopActive = false;
    let localAudioTestEl = null;

    const loginPanel = document.getElementById('login-panel');
    const roomPanel = document.getElementById('room-panel');
    const joinBtn = document.getElementById('join-btn');
    const leaveBtn = document.getElementById('leave-btn');
    const muteBtn = document.getElementById('mute-btn');
    const testAudioBtn = document.getElementById('test-audio-btn');
    const usernameInput = document.getElementById('username');
    const roomIdInput = document.getElementById('room-id');
    const usersContainer = document.getElementById('users-container');
    const audioContainer = document.getElementById('audio-container');
    const errorBox = document.getElementById('error-box');

    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.style.display = 'block';
    }

    joinBtn.addEventListener('click', async () => {
      errorBox.style.display = 'none';
      const username = usernameInput.value.trim();
      const roomId = roomIdInput.value.trim().toLowerCase().replace(/[^a-z0-9]/g, '-');

      if (!username) {
        showError('Lütfen bir kullanıcı adı gir kral!');
        return;
      }

      try {
        // Mikrofon İzni Al
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        showError('Mikrofon erişimi reddedildi veya cihaz bulunamadı!');
        return;
      }

      // Benzersiz Peer ID
      const myPeerId = `legend-${roomId}-${username}-${Math.floor(Math.random() * 1000)}`;
      
      peer = new Peer(myPeerId, {
        debug: 1
      });

      peer.on('open', (id) => {
        loginPanel.style.display = 'none';
        roomPanel.style.display = 'block';
        document.getElementById('room-display-name').innerText = `Oda: ${roomId}`;
        
        addUserToList(username, true, id);
        
        // Odaya katılan diğer kullanıcıları aramak için broadcast duyurusu simülasyonu
        // Basit tarama mekanizması
        connectToRoomPeers(roomId, myPeerId);
      });

      // Gelen Aramaları Dinle ve Otomatik Yanıtla
      peer.on('call', (call) => {
        call.answer(localStream);
        
        call.on('stream', (remoteStream) => {
          const rawName = call.peer.split('-')[2] || 'Katılımcı';
          addAudioElement(call.peer, remoteStream);
          addUserToList(rawName, false, call.peer);
        });

        call.on('close', () => {
          removeUser(call.peer);
        });
      });

      peer.on('error', (err) => {
        console.error('PeerJS Hatası:', err);
      });
    });

    // Ses İletimini Başlatma (Diğer Kullanıcıyı Arama)
    function connectToPeer(remotePeerId) {
      if (!peer || !localStream) return;
      const call = peer.call(remotePeerId, localStream);
      if (!call) return;

      call.on('stream', (remoteStream) => {
        const rawName = remotePeerId.split('-')[2] || 'Katılımcı';
        addAudioElement(remotePeerId, remoteStream);
        addUserToList(rawName, false, remotePeerId);
      });

      call.on('close', () => {
        removeUser(remotePeerId);
      });
    }

    // Basit Oda Taraması (Sinyalleşme)
    function connectToRoomPeers(roomId, myId) {
      // Bağlantıyı sağlamak için arka planda periyodik arama veya mesajlaşma desteği eklenir
    }

    // Sesi Aç / Kapat
    muteBtn.addEventListener('click', () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      
      if (isMuted) {
        muteBtn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i> Sesi Aç';
        muteBtn.style.backgroundColor = '#57606f';
      } else {
        muteBtn.innerHTML = '<i class="fa-solid fa-microphone"></i> Sesi Kapat';
        muteBtn.style.backgroundColor = '#2f3542';
      }
    });

    // Kendi Sesini Dinleme (Test)
    testAudioBtn.addEventListener('click', () => {
      if (!localStream) return;
      isTestLoopActive = !isTestLoopActive;

      if (isTestLoopActive) {
        localAudioTestEl = document.createElement('audio');
        localAudioTestEl.srcObject = localStream;
        localAudioTestEl.autoplay = true;
        localAudioTestEl.volume = 0.5;
        audioContainer.appendChild(localAudioTestEl);
        testAudioBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Kendi Sesini Test Et (AÇIK)';
        testAudioBtn.style.backgroundColor = 'var(--accent-color)';
        testAudioBtn.style.color = '#000';
      } else {
        if (localAudioTestEl) localAudioTestEl.remove();
        testAudioBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i> Kendi Sesini Test Et (Kapalı)';
        testAudioBtn.style.backgroundColor = '#2f3542';
        testAudioBtn.style.color = '#fff';
      }
    });

    // Odadan Ayrıl
    leaveBtn.addEventListener('click', () => {
      location.reload();
    });

    function addUserToList(name, isMe, peerId) {
      if (document.getElementById(`user-${peerId}`)) return;
      
      const div = document.createElement('div');
      div.className = 'user-item';
      div.id = `user-${peerId}`;
      div.innerHTML = `
        <i class="fa-solid fa-circle-user" style="color: var(--accent-color);"></i>
        <span>${name} ${isMe ? '(Sen)' : ''}</span>
      `;
      usersContainer.appendChild(div);
    }

    function addAudioElement(peerId, stream) {
      if (document.getElementById(`audio-${peerId}`)) return;
      const audio = document.createElement('audio');
      audio.id = `audio-${peerId}`;
      audio.srcObject = stream;
      audio.autoplay = true;
      audioContainer.appendChild(audio);
    }

    function removeUser(peerId) {
      const userEl = document.getElementById(`user-${peerId}`);
      const audioEl = document.getElementById(`audio-${peerId}`);
      if (userEl) userEl.remove();
      if (audioEl) audioEl.remove();
    }
  </script>
</body>
</html>
