<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151921;
      --accent-color: #00ff88;
      --accent-hover: #00cc6d;
      --danger-color: #ff4757;
      --text-color: #f1f2f6;
      --text-muted: #a4b0be;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .logo {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      background: #0b0e14;
      border: 1px solid #2f3542;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #fff;
    }

    .btn-secondary {
      background-color: #2f3542;
      color: #fff;
    }

    .room-panel {
      display: none;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 255, 136, 0.1);
      color: var(--accent-color);
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
